worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream app {
        server app:3000;
        keepalive 32;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;          # HTTP/1.1 + HTTP/2 over TCP
        listen 443 quic reuseport; # HTTP/3 over UDP
        http2 on;
        http3 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;        # QUIC requires TLS 1.3

        quic_retry on;
        ssl_early_data on;

        # Tell browsers HTTP/3 is available
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        location / {
            proxy_pass https://app:3000;
            proxy_http_version 1.1;

            # upstream is self-signed too, so don't verify it
            proxy_ssl_verify off;
            proxy_ssl_server_name on;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}