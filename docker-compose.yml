services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ton-app
    restart: unless-stopped
    userns_mode: "keep-id"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DATABASE_URL=postgres://pg:pg@postgres:5432/pg
      - NODE_ENV=production
    volumes:
      - {
        type: bind,
        source: ./data,
        target: /app/data
      }
      - {
        type: bind,
        source: ./data/certs,
        target: /app/certs
      }
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-check-certificate", "https://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: docker.io/postgres:18-alpine
    container_name: ton-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pg
      - POSTGRES_PASSWORD=pg
      - POSTGRES_DB=pg
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d pg"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app-network

  nginx:
    image: docker.io/openresty/openresty:latest
    container_name: ton-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"   # required for HTTP/3 (QUIC)
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data: