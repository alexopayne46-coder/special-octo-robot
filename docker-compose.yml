services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ton-app
    restart: unless-stopped
    userns_mode: "keep-id"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - NODE_ENV=production
    volumes:
      # Persist SQLite database (and certs, if they live in ./data)
      - ./data:/app/data
    healthcheck:
      # app serves HTTPS now, so use https and skip cert verification
      test: ["CMD", "wget", "--spider", "--no-check-certificate", "https://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  nginx:
    image: docker.io/openresty/openresty:latest
    container_name: ton-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"   # required for HTTP/3 (QUIC)
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
      - ./data:/app/data
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge